<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExcelR Website Monitoring Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#202124;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:25px;
}

h1{
    margin:0 0 6px;
    font-size:32px;
}

.subtitle{
    color:#6b7280;
    font-size:14px;
}

.status{
    background:#e8f5e9;
    color:#166534;
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}


/* ==============================
   CARDS
============================== */

.cards{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:25px;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:17px;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.card-label{
    font-size:11px;
    color:#6b7280;
    font-weight:bold;
    text-transform:uppercase;
}

.card-number{
    font-size:28px;
    font-weight:800;
    margin-top:7px;
}


/* ==============================
   SECTION
============================== */

.section{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:22px;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.section h2{
    margin:0 0 15px;
    font-size:21px;
}


/* ==============================
   FILTERS
============================== */

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

input,
select{
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:#fff;
    font-size:14px;
}

input{
    flex:1;
    min-width:280px;
}


/* ==============================
   CHANGE CARD
============================== */

.change-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
    background:#fff;
}

.change-summary{
    padding:16px;
    cursor:pointer;
    list-style:none;
}

.change-summary::-webkit-details-marker{
    display:none;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.summary-left{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.badge-changed{
    background:#fff7ed;
    color:#9a3412;
}

.badge-new{
    background:#ecfdf5;
    color:#047857;
}

.badge-removed{
    background:#fef2f2;
    color:#b91c1c;
}

.badge-failed{
    background:#fef3c7;
    color:#92400e;
}

.priority{
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.priority-high{
    background:#fee2e2;
    color:#b91c1c;
}

.priority-medium{
    background:#fef3c7;
    color:#92400e;
}

.priority-low{
    background:#f3f4f6;
    color:#4b5563;
}

.field{
    font-weight:800;
    font-size:14px;
}

.url{
    font-size:13px;
    color:#374151;
    word-break:break-all;
}

.change-body{
    padding:0 16px 20px;
}


/* ==============================
   OLD / NEW
============================== */

.comparison{
    display:grid;
    grid-template-columns:1fr 50px 1fr;
    gap:12px;
    align-items:stretch;
}

.value-box{
    border-radius:10px;
    padding:14px;
    min-width:0;
}

.old-box{
    background:#fff1f2;
    border:1px solid #fecdd3;
}

.new-box{
    background:#ecfdf5;
    border:1px solid #a7f3d0;
}

.box-title{
    font-size:11px;
    font-weight:900;
    margin-bottom:10px;
}

.old-title{
    color:#be123c;
}

.new-title{
    color:#047857;
}

.value{
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.55;
    font-size:13px;
    max-height:450px;
    overflow:auto;
}

.arrow{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    color:#6b7280;
}


/* ==============================
   HIGHLIGHTED CONTENT
============================== */

.highlight-section{
    margin-top:20px;
}

.highlight-title{
    font-size:14px;
    font-weight:800;
    margin-bottom:10px;
}

.highlight-box{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    background:#fafafa;
}

.highlight-row{
    margin-bottom:12px;
}

.highlight-row:last-child{
    margin-bottom:0;
}

.highlight-label{
    font-size:11px;
    font-weight:900;
    margin-bottom:6px;
}

.removed-label{
    color:#be123c;
}

.added-label{
    color:#047857;
}

.highlight-content{
    line-height:1.65;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
}

.word-removed{
    background:#fecdd3;
    color:#9f1239;
    text-decoration:line-through;
    padding:1px 3px;
    border-radius:3px;
}

.word-added{
    background:#bbf7d0;
    color:#166534;
    padding:1px 3px;
    border-radius:3px;
}


/* ==============================
   DIFF
============================== */

.diff-section{
    margin-top:18px;
}

.diff-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:8px;
}

.diff-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:14px;
    max-height:400px;
    overflow:auto;
}

.diff-box pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.55;
}

.meta{
    margin-top:12px;
    color:#6b7280;
    font-size:13px;
}


/* ==============================
   LEGEND
============================== */

.legend{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:12px;
    font-size:12px;
    color:#6b7280;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.legend-red{
    width:13px;
    height:13px;
    background:#fecdd3;
    border-radius:3px;
}

.legend-green{
    width:13px;
    height:13px;
    background:#bbf7d0;
    border-radius:3px;
}


/* ==============================
   EMPTY
============================== */

.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}


/* ==============================
   TABLE
============================== */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f9fafb;
    color:#6b7280;
    font-size:11px;
    text-transform:uppercase;
}


/* ==============================
   RESPONSIVE
============================== */

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(3,1fr);
    }

    .comparison{
        grid-template-columns:1fr;
    }

    .arrow{
        height:25px;
        transform:rotate(90deg);
    }
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:25px;
    }
}

</style>

</head>


<body>


<div class="container">


<!-- ==============================
     HEADER
============================== -->

<div class="header">

    <div>

        <h1>
            ExcelR Website Monitoring Dashboard
        </h1>

        <div class="subtitle">
            SEO changes, page changes and crawl history
        </div>

    </div>

    <div
        class="status"
        id="status"
    >
        Loading...
    </div>

</div>



<!-- ==============================
     SUMMARY
============================== -->

<div class="cards">


    <div class="card">

        <div class="card-label">
            Pages
        </div>

        <div
            class="card-number"
            id="pagesCount"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="card-label">
            New
        </div>

        <div
            class="card-number"
            id="newCount"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="card-label">
            Changed
        </div>

        <div
            class="card-number"
            id="changedCount"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="card-label">
            Removed
        </div>

        <div
            class="card-number"
            id="removedCount"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="card-label">
            Failed
        </div>

        <div
            class="card-number"
            id="failedCount"
        >
            —
        </div>

    </div>


    <div class="card">

        <div class="card-label">
            High Priority
        </div>

        <div
            class="card-number"
            id="highCount"
        >
            —
        </div>

    </div>


</div>



<!-- ==============================
     CURRENT CHANGES
============================== -->

<div class="section">


    <h2>
        Current Changes
    </h2>


    <div class="filters">


        <input
            id="searchInput"
            type="text"
            placeholder="Search URL, field or details..."
            oninput="renderChanges()"
        >


        <select
            id="typeFilter"
            onchange="renderChanges()"
        >

            <option value="">
                All types
            </option>

            <option value="changed" selected>
                Changed
            </option>

            <option value="new">
                New
            </option>

            <option value="removed">
                Removed
            </option>

            <option value="failed">
                Failed
            </option>

        </select>


        <select
            id="fieldFilter"
            onchange="renderChanges()"
        >

            <option value="">
                All fields
            </option>

        </select>


    </div>


    <div
        class="legend"
    >

        <div class="legend-item">

            <span class="legend-red"></span>

            Removed text

        </div>


        <div class="legend-item">

            <span class="legend-green"></span>

            Added text

        </div>

    </div>


    <div id="changesContainer">

        <div class="empty">
            Loading changes...
        </div>

    </div>


</div>



<!-- ==============================
     HISTORY
============================== -->

<div class="section">


    <h2>
        Crawl History
    </h2>


    <div class="table-wrap">


        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Pages</th>

                    <th>New</th>

                    <th>Changed</th>

                    <th>Removed</th>

                    <th>Failed</th>

                    <th>Duration</th>

                </tr>

            </thead>


            <tbody
                id="historyContainer"
            >

            </tbody>

        </table>

    </div>

</div>


</div>



<script>


/* =====================================================
   GLOBAL DATA
===================================================== */

let changes = [];

let history = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value).replace(
        /[&<>"']/g,
        function(character){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return map[character];

        }
    );

}


/* =====================================================
   FORMAT VALUE
===================================================== */

function formatValue(value){

    if(
        value !== null &&
        typeof value === "object"
    ){

        return JSON.stringify(
            value,
            null,
            2
        );

    }

    return String(
        value ?? ""
    );

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON(file){

    const response =
        await fetch(
            file +
            "?v=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            file +
            " HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* =====================================================
   TOKENIZE TEXT
===================================================== */

function tokenize(text){

    return String(
        text || ""
    ).split(
        /(\s+|[,.!?;:()[\]{}"'`]+)/g
    ).filter(
        function(item){

            return item !== "";

        }
    );

}


/* =====================================================
   WORD LEVEL DIFF
===================================================== */

function makeWordDiff(oldText,newText){

    const oldTokens =
        tokenize(oldText);

    const newTokens =
        tokenize(newText);


    const oldLength =
        oldTokens.length;

    const newLength =
        newTokens.length;


    /*
       LCS MATRIX

       Used to identify unchanged
       portions between OLD and NEW.
    */

    const matrix =
        Array(
            oldLength + 1
        )
        .fill(null)
        .map(
            function(){

                return Array(
                    newLength + 1
                ).fill(0);

            }
        );


    for(
        let i = oldLength - 1;
        i >= 0;
        i--
    ){

        for(
            let j = newLength - 1;
            j >= 0;
            j--
        ){

            if(
                oldTokens[i] ===
                newTokens[j]
            ){

                matrix[i][j] =
                    matrix[i + 1][j + 1] + 1;

            }

            else{

                matrix[i][j] =
                    Math.max(
                        matrix[i + 1][j],
                        matrix[i][j + 1]
                    );

            }

        }

    }


    const removed = [];

    const added = [];

    let i = 0;

    let j = 0;


    while(
        i < oldLength &&
        j < newLength
    ){

        if(
            oldTokens[i] ===
            newTokens[j]
        ){

            i++;
            j++;

        }

        else if(
            matrix[i + 1][j] >=
            matrix[i][j + 1]
        ){

            removed.push(
                oldTokens[i]
            );

            i++;

        }

        else{

            added.push(
                newTokens[j]
            );

            j++;

        }

    }


    while(
        i < oldLength
    ){

        removed.push(
            oldTokens[i]
        );

        i++;

    }


    while(
        j < newLength
    ){

        added.push(
            newTokens[j]
        );

        j++;

    }


    return {

        removed:
            removed.join(""),

        added:
            added.join("")

    };

}


/* =====================================================
   CONVERT latest_diffs.json
===================================================== */

function convertLatestDiffs(data){

    const result = [];


    if(
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ){

        return result;

    }


    Object.entries(data).forEach(
        function([url,records]){


            if(
                !Array.isArray(records)
            ){

                return;

            }


            records.forEach(
                function(record){


                    const field =
                        record.field ||
                        "Content";


                    let priority =
                        "low";


                    if(
                        field === "Title" ||
                        field === "H1" ||
                        field === "Canonical" ||
                        field === "Robots"
                    ){

                        priority = "high";

                    }

                    else if(
                        field === "Description"
                    ){

                        priority = "medium";

                    }


                    result.push({

                        type:"changed",

                        url:url,

                        field:field,

                        priority:priority,

                        details:
                            field +
                            " changed",

                        old:
                            record.before ??
                            "",

                        new:
                            record.after ??
                            "",

                        diff:
                            record.diff ??
                            ""

                    });


                }
            );


        }
    );


    return result;

}


/* =====================================================
   NORMALIZE ARRAY FORMAT
===================================================== */

function normalizeArrayChanges(data){

    if(
        !Array.isArray(data)
    ){

        return [];

    }


    return data.map(
        function(item){

            return {

                type:
                    String(
                        item.type ||
                        "changed"
                    ).toLowerCase(),

                url:
                    item.url ||
                    "",

                field:
                    item.field ||
                    "",

                priority:
                    String(
                        item.priority ||
                        "low"
                    ).toLowerCase(),

                details:
                    item.details ||
                    "",

                old:
                    item.old ??
                    item.before ??
                    "",

                new:
                    item.new ??
                    item.after ??
                    "",

                diff:
                    item.diff ||
                    ""

            };

        }
    );

}


/* =====================================================
   BADGE
===================================================== */

function getBadge(type){

    let className =
        "badge-changed";


    if(
        type === "new"
    ){

        className =
            "badge-new";

    }

    else if(
        type === "removed"
    ){

        className =
            "badge-removed";

    }

    else if(
        type === "failed"
    ){

        className =
            "badge-failed";

    }


    return `

        <span
            class="badge ${className}"
        >

            ${escapeHTML(
                type.toUpperCase()
            )}

        </span>

    `;

}


/* =====================================================
   PRIORITY
===================================================== */

function getPriority(priority){

    let className =
        "priority-low";


    if(
        priority === "high"
    ){

        className =
            "priority-high";

    }

    else if(
        priority === "medium"
    ){

        className =
            "priority-medium";

    }


    return `

        <span
            class="priority ${className}"
        >

            ${escapeHTML(
                priority.toUpperCase()
            )}

        </span>

    `;

}


/* =====================================================
   RENDER HIGHLIGHTED DIFFERENCE
===================================================== */

function renderHighlightedDifference(
    oldText,
    newText
){

    const result =
        makeWordDiff(
            oldText,
            newText
        );


    let html = "";


    if(
        result.removed
    ){

        html += `

            <div class="highlight-row">

                <div
                    class="highlight-label removed-label"
                >

                    🔴 REMOVED FROM PAGE

                </div>


                <div
                    class="highlight-content"
                >

                    <span
                        class="word-removed"
                    >

                        ${escapeHTML(
                            result.removed
                        )}

                    </span>

                </div>

            </div>

        `;

    }


    if(
        result.added
    ){

        html += `

            <div class="highlight-row">

                <div
                    class="highlight-label added-label"
                >

                    🟢 ADDED TO PAGE

                </div>


                <div
                    class="highlight-content"
                >

                    <span
                        class="word-added"
                    >

                        ${escapeHTML(
                            result.added
                        )}

                    </span>

                </div>

            </div>

        `;

    }


    if(
        !result.removed &&
        !result.added
    ){

        html = `

            <div class="empty">

                No textual difference detected.

            </div>

        `;

    }


    return html;

}


/* =====================================================
   RENDER CHANGES
===================================================== */

function renderChanges(){


    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase();


    const type =
        document
        .getElementById(
            "typeFilter"
        )
        .value;


    const field =
        document
        .getElementById(
            "fieldFilter"
        )
        .value;


    const filtered =
        changes.filter(
            function(change){


                const searchableText = (

                    change.url +
                    " " +
                    change.field +
                    " " +
                    change.details +
                    " " +
                    formatValue(
                        change.old
                    ) +
                    " " +
                    formatValue(
                        change.new
                    )

                ).toLowerCase();


                return (

                    (
                        !search ||
                        searchableText.includes(
                            search
                        )
                    )

                    &&

                    (
                        !type ||
                        change.type === type
                    )

                    &&

                    (
                        !field ||
                        change.field === field
                    )

                );

            }
        );


    const container =
        document.getElementById(
            "changesContainer"
        );


    if(
        filtered.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                No matching changes detected.

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(
            function(change){


                let body = "";


                /* =================================
                   CHANGED
                ================================= */

                if(
                    change.type ===
                    "changed"
                ){

                    body = `

                        <div
                            class="comparison"
                        >


                            <div
                                class="value-box old-box"
                            >

                                <div
                                    class="box-title old-title"
                                >

                                    🔴 OLD / BEFORE

                                </div>


                                <div class="value">

                                    ${escapeHTML(
                                        formatValue(
                                            change.old
                                        )
                                    )}

                                </div>

                            </div>


                            <div class="arrow">

                                →

                            </div>


                            <div
                                class="value-box new-box"
                            >

                                <div
                                    class="box-title new-title"
                                >

                                    🟢 NEW / AFTER

                                </div>


                                <div class="value">

                                    ${escapeHTML(
                                        formatValue(
                                            change.new
                                        )
                                    )}

                                </div>

                            </div>


                        </div>


                        <div
                            class="highlight-section"
                        >

                            <div
                                class="highlight-title"
                            >

                                📍 EXACT CONTENT CHANGES

                            </div>


                            <div
                                class="highlight-box"
                            >

                                ${renderHighlightedDifference(
                                    change.old,
                                    change.new
                                )}

                            </div>

                        </div>


                        ${
                            change.diff
                            ?

                            `

                            <div
                                class="diff-section"
                            >

                                <div
                                    class="diff-title"
                                >

                                    Technical Diff

                                </div>


                                <div
                                    class="diff-box"
                                >

                                    <pre>${escapeHTML(
                                        change.diff
                                    )}</pre>

                                </div>

                            </div>

                            `

                            :

                            ""

                        }


                        <div class="meta">

                            ${escapeHTML(
                                change.details
                            )}

                        </div>

                    `;

                }


                /* =================================
                   NEW
                ================================= */

                else if(
                    change.type ===
                    "new"
                ){

                    body = `

                        <div class="meta">

                            🟢 New page discovered.

                        </div>

                    `;

                }


                /* =================================
                   REMOVED
                ================================= */

                else if(
                    change.type ===
                    "removed"
                ){

                    body = `

                        <div class="meta">

                            🔴 Page removed or returned 404/410.

                        </div>

                    `;

                }


                /* =================================
                   FAILED
                ================================= */

                else{

                    body = `

                        <div class="meta">

                            ⚠️ ${escapeHTML(
                                change.details ||
                                "Temporary crawl failure."
                            )}

                        </div>

                    `;

                }


                return `

                    <details
                        class="change-card"
                    >


                        <summary
                            class="change-summary"
                        >

                            <div
                                class="summary-row"
                            >


                                <div
                                    class="summary-left"
                                >

                                    ${getBadge(
                                        change.type
                                    )}


                                    <span
                                        class="field"
                                    >

                                        ${escapeHTML(
                                            change.field
                                        )}

                                    </span>


                                    <span
                                        class="url"
                                    >

                                        ${escapeHTML(
                                            change.url
                                        )}

                                    </span>

                                </div>


                                ${getPriority(
                                    change.priority
                                )}

                            </div>

                        </summary>


                        <div
                            class="change-body"
                        >

                            ${body}

                        </div>


                    </details>

                `;

            }
        ).join("");

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    const container =
        document.getElementById(
            "historyContainer"
        );


    if(
        history.length === 0
    ){

        container.innerHTML = `

            <tr>

                <td colspan="7">

                    No crawl history available.

                </td>

            </tr>

        `;

        return;

    }


    container.innerHTML =
        history
        .slice()
        .reverse()
        .map(
            function(item){

                return `

                    <tr>

                        <td>

                            ${escapeHTML(
                                item.date ||
                                item.checked_at ||
                                ""
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                item.pages ??
                                "—"
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                item.new ??
                                0
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                item.changed ??
                                0
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                item.removed ??
                                0
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                item.failed ??
                                0
                            )}

                        </td>


                        <td>

                            ${
                                item.duration !==
                                undefined

                                ?

                                escapeHTML(
                                    item.duration
                                ) +
                                " sec"

                                :

                                "—"
                            }

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}


/* =====================================================
   FIELD FILTER
===================================================== */

function buildFieldFilter(){

    const fields =
        [
            ...new Set(

                changes
                .map(
                    function(change){

                        return change.field;

                    }
                )
                .filter(Boolean)

            )
        ]
        .sort();


    const select =
        document.getElementById(
            "fieldFilter"
        );


    select.innerHTML = `

        <option value="">
            All fields
        </option>

    `;


    fields.forEach(
        function(field){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                field;

            option.textContent =
                field;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

    try{

        let latest = null;


        /* LOAD LATEST DIFF */

        try{

            latest =
                await loadJSON(
                    "data/latest_diffs.json"
                );

        }

        catch(error){

            console.log(
                "latest_diffs.json could not be loaded"
            );

        }


        /* LOAD HISTORY */

        try{

            history =
                await loadJSON(
                    "data/history.json"
                );

        }

        catch(error){

            history = [];

        }


        /* CONVERT CURRENT FORMAT */

        if(
            latest &&
            typeof latest === "object" &&
            !Array.isArray(latest)
        ){

            changes =
                convertLatestDiffs(
                    latest
                );

        }


        /* ARRAY FORMAT FALLBACK */

        else if(
            Array.isArray(latest)
        ){

            changes =
                normalizeArrayChanges(
                    latest
                );

        }


        /* HISTORY FALLBACK */

        else if(
            history.length > 0 &&
            Array.isArray(
                history[
                    history.length - 1
                ].changes
            )
        ){

            changes =
                normalizeArrayChanges(
                    history[
                        history.length - 1
                    ].changes
                );

        }


        const last =
            history.length > 0
            ?
            history[
                history.length - 1
            ]
            :
            {};


        /* SUMMARY */

        document
        .getElementById(
            "pagesCount"
        )
        .textContent =
            last.pages ??
            "—";


        document
        .getElementById(
            "newCount"
        )
        .textContent =
            changes.filter(
                function(change){

                    return change.type === "new";

                }
            ).length;


        document
        .getElementById(
            "changedCount"
        )
        .textContent =
            changes.filter(
                function(change){

                    return change.type === "changed";

                }
            ).length;


        document
        .getElementById(
            "removedCount"
        )
        .textContent =
            changes.filter(
                function(change){

                    return change.type === "removed";

                }
            ).length;


        document
        .getElementById(
            "failedCount"
        )
        .textContent =
            last.failed ??
            0;


        document
        .getElementById(
            "highCount"
        )
        .textContent =
            changes.filter(
                function(change){

                    return change.priority ===
                        "high";

                }
            ).length;


        buildFieldFilter();

        renderChanges();

        renderHistory();


        document
        .getElementById(
            "status"
        )
        .textContent =
            "Monitoring data loaded";


    }

    catch(error){

        console.error(error);


        document
        .getElementById(
            "status"
        )
        .textContent =
            "Data load error";


        document
        .getElementById(
            "changesContainer"
        )
        .innerHTML = `

            <div class="empty">

                Could not load monitoring data.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* START */

loadDashboard();

</script>
