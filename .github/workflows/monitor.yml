- name: Save Results
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add dashboard.html \
      data/snapshot.json \
      data/history.json \
      data/latest_diffs.json \
      data/content.json.gz \
      data/details.json.gz \
      data/diff_details

    git diff --cached --quiet || git commit -m "Update site monitoring data"
    git push
